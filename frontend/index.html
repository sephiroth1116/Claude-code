<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stolen Bike Finder</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --border: #e2e0db;
    --text: #1f1e1c;
    --muted: #6b6862;
    --accent: #b6472e;
    --accent-soft: #f6e4de;
    --good: #2f6f4e;
    --good-soft: #e3f0e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 20px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .bike-list { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 0.9rem; }
  .radius-line { margin-top: 4px; }
  .sources { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .badge {
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.on { color: var(--good); border-color: var(--good); background: var(--good-soft); }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    padding: 8px 14px;
  }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .radius-control {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .radius-control label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .radius-control strong { color: var(--text); }
  #radius-slider { flex: 1; min-width: 140px; max-width: 320px; accent-color: var(--accent); }
  .radius-presets { display: flex; gap: 6px; }
  .radius-presets button {
    padding: 4px 10px;
    font-size: 0.78rem;
    border-radius: 999px;
  }
  .radius-presets button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); }
  #error-banner {
    display: none;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img { width: 100%; height: 160px; object-fit: cover; background: #eee; }
  .card .no-image { width: 100%; height: 160px; background: #eee; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.8rem; }
  .card-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card-title { font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }
  .meta-row { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--muted); }
  .score-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .score {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .matched-bike {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--good-soft);
    color: var(--good);
  }
  .reasons { font-size: 0.78rem; color: var(--muted); margin: 0; padding-left: 16px; }
  .card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; flex-wrap: wrap; }
  .card-actions button { flex: 1; font-size: 0.75rem; padding: 6px 8px; }
  .card-actions button.active { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .empty-state { text-align: center; color: var(--muted); padding: 60px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Stolen Bike Finder</h1>
      <div class="bike-list" id="bike-list">Loading bike details&hellip;</div>
      <div class="sources" id="sources"></div>
    </div>
    <button class="primary" id="refresh-btn">Refresh listings</button>
  </header>

  <div id="error-banner"></div>

  <div class="radius-control">
    <label for="radius-slider">Search radius: <strong id="radius-value">30</strong> mi</label>
    <input type="range" id="radius-slider" min="5" max="500" step="5" value="30" />
    <div class="radius-presets">
      <button type="button" class="preset" data-radius="50">50 mi</button>
      <button type="button" class="preset" data-radius="250">250 mi</button>
      <button type="button" class="preset" data-radius="500">500 mi</button>
    </div>
  </div>

  <div class="controls">
    <label>Min score
      <select id="min-score">
        <option value="0">Any</option>
        <option value="2">2+</option>
        <option value="4" selected>4+</option>
        <option value="6">6+</option>
      </select>
    </label>
    <label>Status
      <select id="status-filter">
        <option value="">All</option>
        <option value="new" selected>New</option>
        <option value="reviewed">Reviewed</option>
        <option value="false_positive">False positive</option>
        <option value="contacted_police">Contacted police</option>
      </select>
    </label>
    <label>Bike
      <select id="bike-filter">
        <option value="">All bikes</option>
      </select>
    </label>
    <span id="result-count" style="color: var(--muted)"></span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty-state" style="display:none">No listings match these filters yet. Try Refresh, or lower the min score.</div>
</div>

<script>
const API = {
  bikes: '/api/bikes',
  listings: '/api/listings',
  refresh: '/api/refresh',
  status: (id) => `/api/listings/${encodeURIComponent(id)}/status`,
};

let allListings = [];
let _radiusTouchedByUser = false;

async function loadBikes() {
  const res = await fetch(API.bikes);
  const data = await res.json();
  const bikes = data.bikes || [];

  const listEl = document.getElementById('bike-list');
  listEl.innerHTML = '';
  if (!bikes.length) {
    listEl.textContent = 'No bikes configured yet';
  } else {
    for (const b of bikes) {
      const line = document.createElement('div');
      const parts = [b.year, b.make, b.model].filter(Boolean).join(' ');
      line.textContent = `${b.name}: ${parts || '(no make/model set)'}${b.color ? ' · ' + b.color : ''}`;
      listEl.appendChild(line);
    }
    const radiusLine = document.createElement('div');
    radiusLine.className = 'radius-line';
    radiusLine.textContent = `Searching within ${data.radius_miles} mi`;
    listEl.appendChild(radiusLine);
  }

  if (data.radius_miles != null && !_radiusTouchedByUser) {
    const slider = document.getElementById('radius-slider');
    slider.value = Math.min(Math.max(data.radius_miles, slider.min), slider.max);
    document.getElementById('radius-value').textContent = slider.value;
    updateRadiusPresetActive();
  }

  const bikeFilter = document.getElementById('bike-filter');
  const currentValue = bikeFilter.value;
  bikeFilter.innerHTML = '<option value="">All bikes</option>';
  for (const b of bikes) {
    const opt = document.createElement('option');
    opt.value = b.name;
    opt.textContent = b.name;
    bikeFilter.appendChild(opt);
  }
  bikeFilter.value = currentValue;

  const sourcesEl = document.getElementById('sources');
  sourcesEl.innerHTML = '';
  for (const [name, enabled] of Object.entries(data.sources || {})) {
    const span = document.createElement('span');
    span.className = 'badge' + (enabled ? ' on' : '');
    span.textContent = name;
    sourcesEl.appendChild(span);
  }

  const banner = document.getElementById('error-banner');
  if (data.last_refresh_error) {
    banner.style.display = 'block';
    banner.textContent = 'Last refresh had errors: ' + data.last_refresh_error;
  } else {
    banner.style.display = 'none';
  }
}

async function loadListings() {
  const minScore = document.getElementById('min-score').value;
  const res = await fetch(`${API.listings}?min_score=${minScore}`);
  allListings = await res.json();
  render();
}

function render() {
  const statusFilter = document.getElementById('status-filter').value;
  const bikeFilter = document.getElementById('bike-filter').value;
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('empty-state');
  grid.innerHTML = '';

  const filtered = allListings.filter(
    (l) => (!statusFilter || l.status === statusFilter) && (!bikeFilter || l.matched_bike === bikeFilter)
  );
  document.getElementById('result-count').textContent = `${filtered.length} listing(s)`;
  emptyState.style.display = filtered.length ? 'none' : 'block';

  for (const listing of filtered) {
    grid.appendChild(renderCard(listing));
  }
}

function renderCard(listing) {
  const card = document.createElement('div');
  card.className = 'card';

  if (listing.image_url) {
    const img = document.createElement('img');
    img.src = listing.image_url;
    img.alt = listing.title;
    img.loading = 'lazy';
    card.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'no-image';
    ph.textContent = 'No image';
    card.appendChild(ph);
  }

  const body = document.createElement('div');
  body.className = 'card-body';

  const scoreRow = document.createElement('div');
  scoreRow.className = 'score-row';
  const score = document.createElement('span');
  score.className = 'score';
  score.textContent = `score ${listing.score}`;
  scoreRow.appendChild(score);
  if (listing.matched_bike) {
    const bikeTag = document.createElement('span');
    bikeTag.className = 'matched-bike';
    bikeTag.textContent = listing.matched_bike;
    scoreRow.appendChild(bikeTag);
  }
  body.appendChild(scoreRow);

  const title = document.createElement('div');
  title.className = 'card-title';
  const a = document.createElement('a');
  a.href = listing.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  a.textContent = listing.title;
  title.appendChild(a);
  body.appendChild(title);

  const meta = document.createElement('div');
  meta.className = 'meta-row';
  const price = listing.price_usd != null ? `$${listing.price_usd}` : 'no price';
  const dist = listing.distance_miles != null ? `${listing.distance_miles} mi` : '';
  meta.innerHTML = `<span>${listing.source} · ${price}</span><span>${dist}</span>`;
  body.appendChild(meta);

  if (listing.score_reasons && listing.score_reasons.length) {
    const reasons = document.createElement('ul');
    reasons.className = 'reasons';
    for (const r of listing.score_reasons) {
      const li = document.createElement('li');
      li.textContent = r;
      reasons.appendChild(li);
    }
    body.appendChild(reasons);
  }

  const actions = document.createElement('div');
  actions.className = 'card-actions';
  const statuses = [
    ['reviewed', 'Reviewed'],
    ['false_positive', 'Not it'],
    ['contacted_police', 'Reported'],
  ];
  for (const [value, label] of statuses) {
    const btn = document.createElement('button');
    btn.textContent = label;
    if (listing.status === value) btn.classList.add('active');
    btn.addEventListener('click', () => setStatus(listing.id, value));
    actions.appendChild(btn);
  }
  body.appendChild(actions);

  card.appendChild(body);
  return card;
}

async function setStatus(id, status) {
  await fetch(API.status(id), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status }),
  });
  await loadListings();
}

function updateRadiusPresetActive() {
  const value = document.getElementById('radius-slider').value;
  document.querySelectorAll('.radius-presets .preset').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.radius === value);
  });
}

document.getElementById('radius-slider').addEventListener('input', (e) => {
  _radiusTouchedByUser = true;
  document.getElementById('radius-value').textContent = e.target.value;
  updateRadiusPresetActive();
});

document.querySelectorAll('.radius-presets .preset').forEach((btn) => {
  btn.addEventListener('click', () => {
    _radiusTouchedByUser = true;
    const slider = document.getElementById('radius-slider');
    slider.value = btn.dataset.radius;
    document.getElementById('radius-value').textContent = btn.dataset.radius;
    updateRadiusPresetActive();
  });
});

document.getElementById('refresh-btn').addEventListener('click', async () => {
  const btn = document.getElementById('refresh-btn');
  const radiusMiles = document.getElementById('radius-slider').value;
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  try {
    await fetch(`${API.refresh}?radius_miles=${encodeURIComponent(radiusMiles)}`, { method: 'POST' });
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh listings';
    await Promise.all([loadBikes(), loadListings()]);
  }
});

document.getElementById('min-score').addEventListener('change', loadListings);
document.getElementById('status-filter').addEventListener('change', render);
document.getElementById('bike-filter').addEventListener('change', render);

loadBikes();
loadListings();
</script>
</body>
</html>
