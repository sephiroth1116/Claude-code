# Copy this file to config.yaml and fill in your wishlist.
# config.yaml is gitignored so your personal info never gets committed.

wishlist:
  brands: []                 # OR-matched -- any one qualifies, e.g. ["Specialized", "Riese & Muller", "Gazelle"]
  require_class_3: false     # if true, a listing must explicitly say "Class 3" / "28 mph" to count --
                               # never inferred from brand/model alone, since the same model often ships
                               # in multiple speed classes
  max_price_usd: null         # optional hard ceiling; listings priced above this are dropped entirely
  keywords: []                 # optional extra positive signals, e.g. ["ebike", "mid-drive"]

search:
  # Either give a city name Craigslist recognizes as a subdomain (see sources.craigslist.site
  # below) or a lat/lon pair for distance calculations against Craigslist's geotagged listings.
  lat: null
  lon: null
  radius_miles: 25
  extra_keywords: []        # optional extra search terms appended to scraper queries
  exclude_keywords: []      # listings mentioning any of these are dropped entirely, regardless
                              # of score -- e.g. specific model lines you know aren't what you want

sources:
  craigslist:
    enabled: true
    site: ""                # subdomain, e.g. "sfbay", "losangeles", "seattle"
    category: "bia"          # bia = bicycles for sale
  ebay:
    enabled: false
    # App ID / Cert ID come from EBAY_APP_ID / EBAY_CERT_ID env vars, not here.
  facebook:
    enabled: false           # off by default -- see README before turning this on
  upway:
    enabled: false            # currently blocked -- see README, Upway's shopping API isn't working yet
    domain: "upway.co"
  pros_closet:
    enabled: false            # currently blocked -- see README, same issue as Upway
    domain: "theproscloset.com"

alerts:
  email:
    enabled: false
    to: ""
    # SMTP credentials come from SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS env vars.

refresh_interval_minutes: 30
